<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="index.html"><img src="logo.png" alt="Luke at pizza logo" onerror="this.style.display='none'"><span>Luke at <span>Pizza</span></span></a>
    <nav aria-label="Main">

      <a href="our-story.html">Our Story</a>
      <a href="visit.html">Visit</a>

      <button class="icon-btn" id="theme" type="button" aria-label="Switch colour theme" title="Switch colour theme">◐</button>
    </nav>
  </div>
</header>
<main id="top" class="wrap">
  <div class="hero">
    <div>
      <p class="eyebrow">Wood-fired pizzeria</p>
      <h1>Slow dough.<br><em>Fast fire.</em></h1>
      <p class="lead">Every pie starts as a 72-hour dough and spends 90 seconds in a 485°C oven. Order for pickup or delivery, or come sit at the counter and watch the fire.</p>
      <div class="cta">
        <a class="btn" href="menu.html">See the menu</a>
        <a class="btn ghost" href="visit.html">Hours &amp; location</a>
      </div>
    </div>
    <div class="hero-art">

    </div>
  </div>

</main>


<div class="bar" id="bar" hidden>
  <div class="wrap">
    <b id="barText">0 items · $0</b>
    <a class="btn" href="order.html">Checkout</a>
  </div>
</div>
<script type="py" src="main.py"></script>
<script type="py">
vid = q("#heroVid")
mute_btn = q("#mute")


@when("click", "#mute")
def toggle_mute(event):
    vid.muted = not vid.muted
    mute_btn.textContent = "🔇" if vid.muted else "🔊"
    mute_btn.setAttribute("aria-label", "Unmute video" if vid.muted else "Mute video")
    if not vid.muted:
        vid.play()
</script>
</body>
</html>
